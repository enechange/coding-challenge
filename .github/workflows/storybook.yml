name: Deploy Storybook

on:
  push:
    branches: [master]
    paths:
      - 'frontend_challenge_3/challenges/daiend-byte/**'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_challenge_3/challenges/daiend-byte
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
      - run: pnpm build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_challenge_3/challenges/daiend-byte/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
